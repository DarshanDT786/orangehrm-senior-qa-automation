name: QA Automation
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'Admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      ESS_USERNAME: ${{ secrets.ESS_USERNAME }}
      ESS_PASSWORD: ${{ secrets.ESS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Run tests (parallel shards)
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Upload report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 14
